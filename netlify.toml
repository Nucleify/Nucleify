[build]
  command = "npm run build"
  publish = ".output/public"

[build.environment]
  APP_URL = "https://api.nucleify.io"
  API_URL = "https://api.nucleify.io/api"
  NODE_VERSION = "20"
  NETLIFY = "true"
  SSR = "true"

[[redirects]]
  from = "/pl/*"
  to = "/pl/404"
  status = 404

[[redirects]]
  from = "/en/*"
  to = "/en/404"
  status = 404

[[redirects]]
  from = "/*"
  to = "/en/404"
  status = 404
