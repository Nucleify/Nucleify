<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="20 22 160 160"
  fill="none"
  overflow="visible"
  role="img"
  aria-label="Nucleify holographic cube"
>
  <defs>
    <!--
      filterUnits=userSpaceOnUse is required: vertical strokes have ~0 bbox width,
      so objectBoundingBox filter regions collapse and clip the bloom away.
    -->
    <filter
      id="glow-cyan"
      filterUnits="userSpaceOnUse"
      x="-40"
      y="-40"
      width="280"
      height="280"
      color-interpolation-filters="sRGB"
    >
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter
      id="glow-green"
      filterUnits="userSpaceOnUse"
      x="-40"
      y="-40"
      width="280"
      height="280"
      color-interpolation-filters="sRGB"
    >
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter
      id="glow-purple"
      filterUnits="userSpaceOnUse"
      x="-40"
      y="-40"
      width="280"
      height="280"
      color-interpolation-filters="sRGB"
    >
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter
      id="glow-core"
      filterUnits="userSpaceOnUse"
      x="-40"
      y="-40"
      width="280"
      height="280"
      color-interpolation-filters="sRGB"
    >
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter
      id="glow-side"
      filterUnits="userSpaceOnUse"
      x="-40"
      y="-40"
      width="280"
      height="280"
      color-interpolation-filters="sRGB"
    >
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter
      id="haze"
      filterUnits="userSpaceOnUse"
      x="20"
      y="30"
      width="160"
      height="150"
      color-interpolation-filters="sRGB"
    >
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" />
    </filter>

    <linearGradient id="face-top" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="face-left" x1="0%" y1="20%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="face-right" x1="100%" y1="20%" x2="0%" y2="90%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0.03" />
    </linearGradient>

    <linearGradient id="g-top-l" x1="38" y1="68" x2="100" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <linearGradient id="g-top-r" x1="100" y1="34" x2="162" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="g-left-v" x1="38" y1="68" x2="38" y2="136" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="g-right-v" x1="162" y1="68" x2="162" y2="136" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="g-bot-l" x1="38" y1="136" x2="100" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="g-bot-r" x1="162" y1="136" x2="100" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="g-near-l" x1="38" y1="68" x2="100" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#5eead4" />
    </linearGradient>
    <linearGradient id="g-near-r" x1="162" y1="68" x2="100" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="g-near-b" x1="100" y1="102" x2="100" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="g-back-t" x1="100" y1="34" x2="100" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#0f3d32" />
    </linearGradient>
    <linearGradient id="g-back-bl" x1="38" y1="136" x2="100" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e4a5c" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>
    <linearGradient id="g-back-br" x1="162" y1="136" x2="100" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  <rect x="20" y="22" width="160" height="160" fill="#000000" fill-opacity="0" />

  <ellipse cx="100" cy="102" rx="58" ry="48" fill="#14b8a6" opacity="0.06" filter="url(#haze)" />
  <ellipse cx="118" cy="88" rx="40" ry="36" fill="#7c3aed" opacity="0.05" filter="url(#haze)" />
  <g opacity="0.9">
    <path d="M100 34 L162 68 L100 102 L38 68 Z" fill="url(#face-top)" />
    <path d="M38 68 L100 102 L100 170 L38 136 Z" fill="url(#face-left)" />
    <path d="M162 68 L100 102 L100 170 L162 136 Z" fill="url(#face-right)" />
  </g>

  <!-- BACK spokes: dark, thin, NO glow -->
  <g stroke-linecap="round" stroke-linejoin="round" stroke-width="1.35" opacity="0.92">
    <path d="M100 34 L100 102" stroke="url(#g-back-t)" />
    <path d="M38 136 L100 102" stroke="url(#g-back-bl)" />
    <path d="M162 136 L100 102" stroke="url(#g-back-br)" />
  </g>

  <!-- FRONT glow + crisp stroke -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <g opacity="0.95">
      <path d="M38 68 L100 34" stroke="#4ade80" stroke-width="5" filter="url(#glow-green)" opacity="0.55" />
      <path d="M100 34 L162 68" stroke="#a855f7" stroke-width="5" filter="url(#glow-purple)" opacity="0.5" />
      <!-- outer verticals — same strength as other lit edges -->
      <path d="M38 68 L38 136" stroke="#22d3ee" stroke-width="5" filter="url(#glow-side)" opacity="0.5" />
      <path d="M162 68 L162 136" stroke="#a855f7" stroke-width="5" filter="url(#glow-side)" opacity="0.5" />
      <path d="M38 136 L100 170" stroke="#22d3ee" stroke-width="5" filter="url(#glow-cyan)" opacity="0.45" />
      <path d="M162 136 L100 170" stroke="#a855f7" stroke-width="5" filter="url(#glow-purple)" opacity="0.45" />
      <path d="M38 68 L100 102" stroke="#22d3ee" stroke-width="4.5" filter="url(#glow-cyan)" opacity="0.5" />
      <path d="M162 68 L100 102" stroke="#a855f7" stroke-width="4.5" filter="url(#glow-purple)" opacity="0.5" />
      <path d="M100 102 L100 170" stroke="#2dd4bf" stroke-width="4.5" filter="url(#glow-core)" opacity="0.45" />
    </g>

    <g stroke-width="2.15">
      <path d="M38 68 L100 34" stroke="url(#g-top-l)" />
      <path d="M100 34 L162 68" stroke="url(#g-top-r)" />
      <path d="M38 68 L38 136" stroke="url(#g-left-v)" />
      <path d="M162 68 L162 136" stroke="url(#g-right-v)" />
      <path d="M38 136 L100 170" stroke="url(#g-bot-l)" />
      <path d="M162 136 L100 170" stroke="url(#g-bot-r)" />
      <path d="M38 68 L100 102" stroke="url(#g-near-l)" />
      <path d="M162 68 L100 102" stroke="url(#g-near-r)" />
      <path d="M100 102 L100 170" stroke="url(#g-near-b)" />
    </g>
  </g>
</svg>
