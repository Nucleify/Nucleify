name: 🏷️ Modules Auto Release

on:
  push:
    branches: [*]
    paths:
      - 'modules/nuc_*'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.changes.outputs.modules }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Detect Version Changes
        id: changes
        run: |
          MODULES_JSON="[]"
          SUBMODULES_FILE=".bash/config/submodules.txt"
          
          # Read modules from submodules.txt
          while IFS= read -r name || [ -n "$name" ]; do
            [ -z "$name" ] && continue
            
            MODULE_NAME="nuc_$name"
            module_path="modules/$MODULE_NAME"
            config_file="$module_path/config.json"
            
            # Skip if config doesn't exist
            [ -f "$config_file" ] || continue
            
            # Check if submodule reference changed in the commit
            if ! git diff --name-only HEAD~1 HEAD -- "$module_path" | grep -q .; then
              continue
            fi
            
            # Get current version from config.json
            CURRENT_VERSION=$(jq -r '.version' "$config_file")
            
            # Get previous submodule commit
            PREV_COMMIT=$(git ls-tree HEAD~1 "$module_path" 2>/dev/null | awk '{print $3}')
            
            # Get previous version from that commit's config.json
            if [ -n "$PREV_COMMIT" ]; then
              PREVIOUS_VERSION=$(git -C "$module_path" show "$PREV_COMMIT:config.json" 2>/dev/null | jq -r '.version' 2>/dev/null || echo "0.0.0")
            else
              PREVIOUS_VERSION="0.0.0"
            fi
            
            # Check if version changed
            if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
              echo "Version changed for $MODULE_NAME: $PREVIOUS_VERSION -> $CURRENT_VERSION"
              
              # Get module info
              DESCRIPTION=$(jq -r '.description // ""' "$config_file")
              
              # Add to JSON array
              MODULES_JSON=$(echo "$MODULES_JSON" | jq -c \
                --arg name "$MODULE_NAME" \
                --arg version "$CURRENT_VERSION" \
                --arg prev "$PREVIOUS_VERSION" \
                --arg desc "$DESCRIPTION" \
                '. += [{"name": $name, "version": $version, "previous": $prev, "description": $desc}]')
            fi
          done < "$SUBMODULES_FILE"
          
          echo "modules=$MODULES_JSON" >> $GITHUB_OUTPUT
          echo "Modules to release: $MODULES_JSON"

  release:
    needs: detect-changes
    if: needs.detect-changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.modules) }}
      fail-fast: false
    
    steps:
      - name: Create Release in Module Repository
        env:
          GH_TOKEN: ${{ secrets.MODULES_RELEASE_TOKEN }}
          MODULE_NAME: ${{ matrix.module.name }}
          VERSION: ${{ matrix.module.version }}
          DESCRIPTION: ${{ matrix.module.description }}
        run: |
          REPO="Nucleify/$MODULE_NAME"
          TAG="v$VERSION"
          
          echo "Creating release $TAG for $REPO"
          
          # Check if tag already exists
          if gh api "repos/$REPO/git/refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists in $REPO, skipping..."
            exit 0
          fi
          
          # Get the latest commit SHA from the module repo
          COMMIT_SHA=$(gh api "repos/$REPO/commits/main" --jq '.sha')
          
          if [ -z "$COMMIT_SHA" ]; then
            echo "Could not get commit SHA for $REPO"
            exit 1
          fi
          
          echo "Latest commit: $COMMIT_SHA"
          
          # Create tag
          gh api "repos/$REPO/git/refs" \
            -X POST \
            -f ref="refs/tags/$TAG" \
            -f sha="$COMMIT_SHA"
          
          echo "Created tag $TAG"
          
          # Create release
          gh api "repos/$REPO/releases" \
            -X POST \
            -f tag_name="$TAG" \
            -f name="$TAG" \
            -f body="## $MODULE_NAME $TAG

          $DESCRIPTION

          ---

          Released automatically from nucleify main repository." \
            -F draft=false \
            -F prerelease=false
          
          echo "✅ Created release $TAG for $REPO"

