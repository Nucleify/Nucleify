name: 🚀 Laravel

on:
  push:
    branches: [ "prod" ]

jobs:
  # Setup PHP and Checkout Code
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Set up PHP
        uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: '8.3.7'

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Verify .env File Exists
        run: |
          if [ ! -f .env ]; then
            echo ".env file was not created!"
            exit 1
          fi

  # Install Dependencies
  install:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: '8.3.7'

      - name: Cache Composer Dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-interaction --no-scripts --no-progress

  # Generate Application Key
  generate-key:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: '8.3.7'

      - name: Restore Composer Dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Verify .env File Exists
        run: |
          if [ ! -f .env ]; then
            echo ".env file was not created!"
            exit 1
          fi

      - name: Generate Application Key
        run: php artisan key:generate

  # Set Directory Permissions
  set-permissions:
    runs-on: ubuntu-latest
    needs: generate-key
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: '8.3.7'

      - name: Set Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

  # Create Database
  create-database:
    runs-on: ubuntu-latest
    needs: set-permissions
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: '8.3.7'

      - name: Create Database
        run: |
          mkdir -p database
          touch database/database.sqlite

  # Run Tests
  test:
    runs-on: ubuntu-latest
    needs: create-database
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: '8.3.7'

      - name: Restore Composer Dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}

      - name: Run Tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          DB_FOREIGN_KEYS: false
        run: php artisan test --coverage
