name: ⚙️ Bash

on:
  push:
    branches: ['*']

jobs:
  bash-tests:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Run bash test suite
        run: bash .config/bash/tests/run.sh
