name: 🏷️ Modules

on:
  push:
    paths:
      - 'modules/nuc_*'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.changes.outputs.modules }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive

      - name: Detect Unreleased Versions
        id: changes
        env:
          GH_TOKEN: ${{ secrets.MODULES_RELEASE_TOKEN }}
        run: |
          MODULES_JSON="[]"
          SUBMODULES_FILE=".config/bash/config/submodules.txt"
          
          while IFS= read -r name || [ -n "$name" ]; do
            [ -z "$name" ] && continue
            
            MODULE_NAME="nuc_$name"
            module_path="modules/$MODULE_NAME"
            config_file="$module_path/config.json"
            
            [ -f "$config_file" ] || continue
            
            if ! git diff --name-only HEAD~1 HEAD -- "$module_path" | grep -q .; then
              continue
            fi
            
            DESCRIPTION=$(jq -r '.description // ""' "$config_file")
            CURRENT_COMMIT=$(git ls-tree HEAD "$module_path" | awk '{print $3}')
            PREV_COMMIT=$(git ls-tree HEAD~1 "$module_path" 2>/dev/null | awk '{print $3}')
            
            git -C "$module_path" fetch --unshallow 2>/dev/null || git -C "$module_path" fetch --all 2>/dev/null || true
            
            REPO="Nucleify/$MODULE_NAME"
            EXISTING_TAGS=$(gh api "repos/$REPO/git/refs/tags" --paginate --jq '.[].ref' 2>/dev/null | sed 's|refs/tags/v||' || echo "")
            
            if [ -n "$PREV_COMMIT" ]; then
              COMMITS=$(git -C "$module_path" log --format='%H' "$PREV_COMMIT".."$CURRENT_COMMIT" 2>/dev/null || echo "$CURRENT_COMMIT")
            else
              COMMITS="$CURRENT_COMMIT"
            fi
            
            VERSIONS_SEEN=""
            while IFS= read -r commit; do
              [ -z "$commit" ] && continue
              
              VER=$(git -C "$module_path" show "$commit:config.json" 2>/dev/null | jq -r '.version' 2>/dev/null)
              [ -z "$VER" ] || [ "$VER" = "null" ] && continue
              
              echo "$VERSIONS_SEEN" | grep -qF "|$VER|" && continue
              VERSIONS_SEEN="$VERSIONS_SEEN|$VER|"
              
              echo "$EXISTING_TAGS" | grep -qxF "$VER" && continue
              
              echo "Unreleased version found for $MODULE_NAME: v$VER (commit: $commit)"
              
              MODULES_JSON=$(echo "$MODULES_JSON" | jq -c \
                --arg name "$MODULE_NAME" \
                --arg version "$VER" \
                --arg commit "$commit" \
                --arg desc "$DESCRIPTION" \
                '. += [{"name": $name, "version": $version, "commit": $commit, "description": $desc}]')
            done <<< "$COMMITS"
          done < "$SUBMODULES_FILE"
          
          echo "modules=$MODULES_JSON" >> $GITHUB_OUTPUT
          echo "Modules to release: $MODULES_JSON"

  release:
    name: release (${{ matrix.module.name }}, v${{ matrix.module.version }})
    needs: detect-changes
    if: needs.detect-changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ${{ fromJson(needs.detect-changes.outputs.modules) }}
      fail-fast: false
    
    steps:
      - name: Create Release in Module Repository
        env:
          GH_TOKEN: ${{ secrets.MODULES_RELEASE_TOKEN }}
          MODULE_NAME: ${{ matrix.module.name }}
          VERSION: ${{ matrix.module.version }}
          COMMIT_SHA: ${{ matrix.module.commit }}
        run: |
          REPO="Nucleify/$MODULE_NAME"
          TAG="v$VERSION"
          
          echo "Creating release $TAG for $REPO"
          
          if gh api "repos/$REPO/git/refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists in $REPO, skipping..."
            exit 0
          fi
          
          if [ -z "$COMMIT_SHA" ]; then
            echo "No commit SHA provided, falling back to latest main commit"
            COMMIT_SHA=$(gh api "repos/$REPO/commits/main" --jq '.sha')
          fi
          
          if [ -z "$COMMIT_SHA" ]; then
            echo "Could not get commit SHA for $REPO"
            exit 1
          fi
          
          echo "Using commit: $COMMIT_SHA"
          
          gh api "repos/$REPO/git/refs" \
            -X POST \
            -f ref="refs/tags/$TAG" \
            -f sha="$COMMIT_SHA"
          
          echo "Created tag $TAG"
          
          gh api "repos/$REPO/releases" \
            -X POST \
            -f tag_name="$TAG" \
            -f name="$TAG" \
            -F generate_release_notes=true \
            -F draft=false \
            -F prerelease=false
          
          echo "✅ Created release $TAG for $REPO"
